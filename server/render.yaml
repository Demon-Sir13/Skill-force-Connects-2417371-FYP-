services:
  - type: web
    name: skillforce-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set these in Render dashboard — do NOT hardcode secrets here:
      # JWT_SECRET, MONGO_URI, CLIENT_URL, EMAIL_USER, EMAIL_PASS,
      # KHALTI_SECRET_KEY, ESEWA_MERCHANT_ID, ESEWA_SECRET_KEY,
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
